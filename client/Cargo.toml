[package]
name = "staritem"
version = "0.1.0"
edition = "2021"
authors = ["TheFlareStar"]
license = "MIT"

[dependencies]
anyhow = "1"
dirs = "5"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ort = "=2.0.0-rc.10"
rand = "0.8"
rand_distr = "0.4"
raw-window-handle = "0.6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
ureq = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
